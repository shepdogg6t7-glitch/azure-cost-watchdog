[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "costwatchdog"
version = "0.1.0"
description = "Audits Azure cost exports and resource inventories offline, finds idle and orphaned resources, and prices the waste."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []  # standard library only

[project.scripts]
costwatchdog = "costwatchdog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
